<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apex Poker</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f1720" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Apex Poker" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="app-header">
    <div class="brand">♠ Apex Poker</div>
    <div id="header-right" class="header-right"></div>
  </header>

  <main id="app-root"></main>

  <div id="toast-container"></div>

  <script>
    window.addEventListener("error", (e) => {
      var el = document.getElementById("app-root");
      if (el) el.innerHTML =
        '<pre style="color:#fff;background:#611;padding:16px;white-space:pre-wrap;border-radius:8px;">JS ERROR:\n' +
        (e.message || "") + "\n" + (e.filename || "") + ":" + (e.lineno || "") + ":" + (e.colno || "") +
        "\n" + (e.error && e.error.stack ? e.error.stack : "") + "</pre>";
    });
    window.addEventListener("unhandledrejection", (e) => {
      var el = document.getElementById("app-root");
      if (el) el.innerHTML =
        '<pre style="color:#fff;background:#611;padding:16px;white-space:pre-wrap;border-radius:8px;">PROMISE ERROR:\n' +
        (e.reason && e.reason.stack ? e.reason.stack : String(e.reason)) + "</pre>";
    });
  </script>
  <script type="module" src="/js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {
          /* PWA install just won't be offered; app still works fine */
        });
      });
    }
  </script>
</body>
</html>
